<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="160" viewBox="0 0 1920 80">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5E0707"/>
      <stop offset="0.35" stop-color="#A50F17"/>
      <stop offset="0.5" stop-color="#C8141D"/>
      <stop offset="0.65" stop-color="#A50F17"/>
      <stop offset="1" stop-color="#5E0707"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.6">
      <stop offset="0" stop-color="#FF5A4A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF5A4A" stop-opacity="0"/>
    </radialGradient>
    <g id="cross">
      <path d="M42 8 Q46 4 49 8 C44 40 36 70 33 99 Q31 101 29 99 C31 70 37 40 42 8 Z"/>
      <path d="M8 47 Q6 44 10 43 C35 36 65 29 93 23 Q98 23 97 27 Q96 30 92 30 C65 34 37 41 12 49 Q9 50 8 47 Z"/>
      <path d="M48 23 Q51 21 52 24 C52 32 52 40 51 47 Q50 50 48 47 C48 40 48 32 48 23 Z"/>
    </g>
  </defs>
  <rect width="1920" height="80" fill="url(#bg)"/>
  <rect x="560" y="0" width="800" height="80" fill="url(#spot)"/>

  <!-- Left: Harvesters mark + tagline (desktop) -->
  <g fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" transform="translate(34 10) scale(0.6)"><use href="#cross"/></g>
  <text x="100" y="46" font-family="Latin Modern Roman" font-size="17" letter-spacing="2.5" fill="#FFFFFF">HARVESTERS</text>
  <line x1="250" y1="20" x2="250" y2="60" stroke="#FFFFFF" stroke-opacity="0.35"/>
  <text x="268" y="37" font-family="Anton" font-size="21" letter-spacing="0.6" fill="#FFD21F">365 DAYS. COUNTLESS BLESSINGS.</text>
  <text x="268" y="62" font-family="Anton" font-size="21" letter-spacing="0.6" fill="#FFD21F">ONE FAITHFUL GOD!</text>

  <!-- Centre (safe area for phones): MEGA Thanks-giving + date -->
  <text x="770" y="50" font-family="Latin Modern Roman" font-size="50" letter-spacing="4" fill="#FFFFFF">MEGA</text>
  <text x="858" y="66" font-family="TeX Gyre Chorus" font-size="40" fill="#FFD21F">Thanks-giving</text>
  <line x1="1078" y1="18" x2="1078" y2="62" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1094" y="38" font-family="Anton" font-size="19" letter-spacing="1.5" fill="#FFFFFF">SUN 6 DEC</text><text x="1094" y="60" font-family="Anton" font-size="15" letter-spacing="1.2" fill="#FFD21F">ALL CAMPUSES</text>

  <!-- Right: date line + CTA (desktop) -->
  <text x="1355" y="35" font-family="TeX Gyre Termes" font-size="18" letter-spacing="2.2" fill="#FFFFFF">6TH DECEMBER 2026</text>
  <text x="1355" y="60" font-family="TeX Gyre Termes" font-size="18" letter-spacing="2.2" fill="#FFFFFF">ACROSS ALL CAMPUSES</text>
  <rect x="1652" y="22" width="230" height="36" rx="18" fill="#FFD21F"/>
  <text x="1767" y="46" text-anchor="middle" font-family="Anton" font-size="17" letter-spacing="1.2" fill="#7A0A0A">PLAN YOUR VISIT  →</text>
</svg>
