<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | MyHarvestHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #faf5ff;
            color: #1f2937;
            padding: 1rem;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1025;
                color: #e5e7eb;
            }

            .card {
                background: #231430;
                border-color: #3b2052;
            }

            .btn-primary {
                background: #9333ea;
            }

            .btn-secondary {
                border-color: #6b21a8;
                color: #c084fc;
            }
        }

        .card {
            text-align: center;
            max-width: 420px;
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid #e9d5ff;
            background: #fff;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        p {
            color: #6b7280;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.625rem 1.25rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
        }

        .btn-primary {
            background: #9333ea;
            color: #fff;
        }

        .btn-primary:hover {
            background: #7e22ce;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #d8b4fe;
            color: #9333ea;
        }

        .btn-secondary:hover {
            background: #f5f3ff;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Some features may be unavailable until you're back
            online.</p>
        <div class="btn-group">
            <button class="btn btn-primary" onclick="window.location.reload()">Try Again</button>
            <a class="btn btn-secondary" href="/">Go Home</a>
        </div>
    </div>
</body>

</html>
